aid: kandou
name: Kandou
description: 'Kandou (Kandou AI) is a fabless semiconductor company founded in 2011 by
  Amin Shokrollahi and headquartered in Lausanne, Switzerland. It designs high-speed,
  energy-efficient chip-to-chip interconnect technology built on its proprietary Copper
  MIMO / Chord Signaling architecture, which turns noise in copper channels into usable
  bandwidth for massively scalable AI systems. Products include the Glasswing chiplet
  interconnect IP, the Regli PCIe retimer, the Matterhorn USB4 retimer, the Zetti PCIe
  switch, and AI Fabric memory/networking platforms. Chord signaling has been adopted
  into JEDEC and OIF industry specifications. Backed by Bessemer Venture Partners across
  multiple rounds, Kandou raised a $225M round in March 2026 led by Maverick Silicon
  with strategic participation from SoftBank, Synopsys, Cadence, and Alchip. This is a
  hardware/semiconductor IP company with no public REST/GraphQL API, SDK, or developer
  platform surface.'
